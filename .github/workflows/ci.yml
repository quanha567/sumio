name: CI & PR Preview

on:
  push:
    branches: [main, master, production]
    paths:
      - 'sumio-fe/**'
      - 'packages/contract/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master, production]
    paths:
      - 'sumio-fe/**'
      - 'packages/contract/**'
      - '.github/workflows/ci.yml'
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (Lint, Format, Typecheck, Test, Build)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sumio-fe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@v6
        with:
          path: sumio-fe/node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - name: Quality Check (Lint & Format & TypeCheck)
        run: vp check

      - name: Run Tests
        run: vp test --passWithNoTests

      - name: Build Project
        run: vp build

      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: sumio-fe/node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sumio-fe-dist
          path: sumio-fe/dist/
          retention-days: 7

  preview-deploy:
    name: Deploy PR Preview to Cloudflare Pages (sumio-dev)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    needs: [quality-gate]
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    defaults:
      run:
        working-directory: sumio-fe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: sumio-fe-dist
          path: sumio-fe/dist/

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun x wrangler pages project create sumio-dev --production-branch main || true

      - name: Deploy Preview to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUTPUT=$(bun x wrangler pages deploy dist --project-name=sumio-dev --branch="${{ github.head_ref }}" --commit-dirty=true)
          echo "$OUTPUT"
          PREVIEW_URL=$(echo "$OUTPUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.sumio-dev\.pages\.dev' | head -n 1)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(echo "$OUTPUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' | head -n 1)
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Post or Update Sticky PR Comment
        uses: actions/github-script@v9
        if: steps.deploy.outputs.preview_url != ''
        with:
          script: |
            const marker = '<!-- sumio-fe-preview-deploy -->';
            const previewUrl = '${{ steps.deploy.outputs.preview_url }}';
            const commitSha = '${{ github.event.pull_request.head.sha }}';
            const body = `${marker}
            ### ⚡ Sumio Cloudflare Pages Preview Deployed

            | Name | Link |
            | :--- | :--- |
            | **Latest Commit** | \`${commitSha.substring(0, 7)}\` |
            | **Preview URL** | [${previewUrl}](${previewUrl}) |
            | **Environment** | \`sumio-dev\` (Preview) |

            _Built and deployed automatically with Vite+ and Cloudflare Pages._`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
