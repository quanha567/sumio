name: Continuous Delivery (Dev & Prod)

on:
  push:
    branches: [main]
    paths:
      - 'sumio-fe/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: cd-deploy-main
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy to Dev (sumio-dev)
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://sumio-dev.pages.dev
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: sumio-fe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Quality Check
        run: vp check

      - name: Run Tests
        run: vp test --passWithNoTests

      - name: Build Project for Dev
        run: vp build

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create sumio-dev --production-branch main || true

      - name: Deploy to Cloudflare Pages (Dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name=sumio-dev --branch=main --commit-dirty=true

  deploy-prod:
    name: Deploy to Production (sumio)
    needs: [deploy-dev]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sumio.pages.dev
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: sumio-fe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build Project for Production
        run: vp build

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create sumio --production-branch main || true

      - name: Deploy to Cloudflare Pages (Production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name=sumio --branch=main --commit-dirty=true
