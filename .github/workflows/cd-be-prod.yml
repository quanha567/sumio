name: CD Backend Production

on:
  push:
    branches: [production]
    paths:
      - 'sumio-be/**'
      - 'packages/contract/**'
      - '.github/workflows/cd-be-prod.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: cd-be-prod
  cancel-in-progress: false

jobs:
  migrate-prod:
    name: Run Pre-Deployment DB Migrations (Production)
    runs-on: ubuntu-24.04
    environment:
      name: production
    permissions:
      contents: read

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Execute TypeORM Migrations (Prod Session Pooler)
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning ::MIGRATION_DATABASE_URL not configured in production. Skipping migrations."
          else
            bun run --cwd sumio-be db:migrate
          fi

  deploy-prod:
    name: Deploy to Cloudflare Workers (sumio-be)
    needs: [migrate-prod]
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.BACKEND_PROD_URL }}
    permissions:
      contents: write
      deployments: write

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Synchronize Secret to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "${{ secrets.DATABASE_URL }}" | bun run --cwd sumio-be wrangler secret put DATABASE_URL --env production
          else
            echo "::warning ::DATABASE_URL secret not provided in production environment."
          fi

      - name: Deploy Worker to Production Environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --cwd sumio-be wrangler deploy --env production

      - name: Post-Deployment Smoke Test
        run: |
          PROD_URL="${{ vars.BACKEND_PROD_URL }}"
          if [ -z "$PROD_URL" ]; then
            echo "BACKEND_PROD_URL not configured. Skipping smoke test."
            exit 0
          fi
          echo "Executing health probe on $PROD_URL/health..."
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/health" || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "Health probe succeeded with HTTP 200!"
              exit 0
            fi
            echo "Attempt $i: Received HTTP status $STATUS. Retrying in 5 seconds..."
            sleep 5
          done
          echo "::warning ::Worker health probe did not return 200 within timeout."

      - name: Create or Update Production Release Note
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date().toISOString().slice(0, 10);
            const tag = `release-be-${now}-${context.runNumber}`;
            try {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `🚀 Backend Production Release ${tag}`,
                body: `## 🚀 Sumio Backend Production Release\n\n- **Target**: Cloudflare Worker \`sumio-be\`\n- **Commit**: \`${context.sha}\`\n- **Triggered By**: @${context.actor}\n\nAutomated delivery pipeline completed successfully with pre-deployment migrations and health probe confirmation.`,
                generate_release_notes: true,
              });
              console.log(`Created GitHub Release for tag: ${tag}`);
            } catch (err) {
              console.log(`Release note creation info: ${err.message}`);
            }
